name: Frontend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-lint:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar dependências
        run: |
          cd frontend
          npm ci

      - name: Rodar lint
        run: |
          cd frontend
          npm run lint || echo " Lint script não encontrado"

      - name: Build de produção
        run: |
          cd frontend
          npm run build
        env:
          CI: false

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir tags baseado na branch
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAGS=${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:latest,${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "TAGS=${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:develop,${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "TAGS=${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:${{ github.ref_name }},${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
