name: Frontend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm install --prefer-offline --no-audit --no-fund
          else
            mkdir -p frontend
            cd frontend
            npm init -y
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Verificar formato do código
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm run format:check || echo "Nenhum script de formatação encontrado"
          fi

      - name: Executar lint
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm run lint || echo "Nenhum script lint encontrado"
          fi

      - name: Executar testes
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm test -- --coverage --watchAll=false || echo "Nenhum script de teste encontrado"
          fi

      - name: Construir o projeto
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm run build || echo "Nenhum script de compilação encontrado"
          fi
        env:
          CI: false

      - name: Upload dos artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7
        if: always()

      - name: Upload dos relatórios de teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            frontend/coverage/
            frontend/test-results/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar auditorias de segurança
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm audit --production || echo "Vulnerabilidades de segurança encontradas"
          fi

      - name: Verificar vulnerabilidades em dependências
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    if: github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
