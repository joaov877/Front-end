name: CI de Frontend

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-test:
    name: Construir e Testar
    runs-on: ubuntu-latest

    steps:
      - name: Finalizar compra do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Verifique o formato do código
        run: npm run format:check || echo "Nenhum script de formatação encontrado"

      - name: lint executáveis
        run: npm run lint || echo "Nenhum script lint encontrado"

      - name: Executar testes
        run: |
          mkdir -p coverage test-results
          npm test -- --coverage --watchAll=false || echo "Nenhum script de teste encontrado"

      - name: Construir o projeto
        run: |
          mkdir -p dist
          npm run build || echo "Nenhum script de build encontrado"
        env:
          CI: false

      - name: Upload dos artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7
        if: always()

      - name: Upload dos relatórios de teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            coverage/
            test-results/
          retention-days: 7

  security-scan:
    name: Verificação de Segurança
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Finalizar compra do código
        uses: actions/checkout@v4

      - name: Executar auditorias de segurança
        run: npm audit --production || echo "Vulnerabilidades de segurança detectadas"

      - name: Verifique vulnerabilidades em dependências
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  docker-build:
    name: Criar e enviar imagem Docker
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    if: github.event_name == 'push'

    steps:
      - name: Finalizar compra do código
        uses: actions/checkout@v4

      - name: Verificar estrutura de arquivos
        run: |
          echo "=== CONTEÚDO DA RAIZ ==="
          ls -la
          echo ""
          echo "=== VERIFICANDO DOCKERFILE ==="
          if [ -f "Dockerfile" ]; then
            echo " Dockerfile encontrado na raiz"
            echo "=== CONTEÚDO DO DOCKERFILE ==="
            cat Dockerfile
          else
            echo " Dockerfile NÃO encontrado na raiz"
            echo "=== PROCURANDO EM TODOS OS LUGARES ==="
            find . -name "Dockerfile" -type f 2>/dev/null || echo "Nenhum Dockerfile encontrado"
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-react:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
